name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-service-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PACKAGE_NAME: forms-ai-release
  AZURE_WEBAPP_NAME: Forms-AI

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: forms_ai_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/forms_ai_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck, lint, unit and integration tests, production build
        run: npm run verify

      - name: Integration tests against PostgreSQL
        run: npm run test:postgres

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Assemble deployment package
        run: |
          mkdir -p release/shared release/backend release/frontend
          cp package.json package-lock.json release/
          cp shared/package.json release/shared/
          cp -r shared/dist release/shared/dist
          cp backend/package.json release/backend/
          cp -r backend/dist release/backend/dist
          cp frontend/package.json release/frontend/
          cp -r frontend/dist release/frontend/dist
          cd release
          npm pkg delete scripts.build
          npm ci --omit=dev --workspace=backend --no-audit --no-fund
          rm -rf node_modules/@forms-ai
          mkdir -p node_modules/@forms-ai/contracts
          cp -r shared/package.json shared/dist node_modules/@forms-ai/contracts/
          zip -qr "../${PACKAGE_NAME}.zip" .

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.zip
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to App Service
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8F6069E22A934DBFB024F195C0C1DED7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C9C0B7C5E210458BB74002B2900586BC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6E819B53724E453B9970C45DF8F5443E }}

      - name: Deploy package
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ${{ env.PACKAGE_NAME }}.zip

      - name: Publish deployment summary
        run: |
          {
            echo "### Deployed to Azure App Service"
            echo ""
            echo "Web App: \`${AZURE_WEBAPP_NAME}\`"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "URL: ${{ steps.deploy.outputs.webapp-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign out of Azure
        if: always()
        run: az logout || true
